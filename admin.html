
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101820">
<title>إدارة MOZA LEGAL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#0b1118;
  --panel:#121d27;
  --panel2:#172530;
  --line:rgba(255,255,255,.09);
  --text:#edf3f5;
  --muted:#91a2ad;
  --gold:#d6b36a;
  --gold2:#f0d49a;
  --green:#32c987;
  --red:#f06b72;
  --blue:#70adf5;
  --orange:#e9ae58;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:'Cairo',sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 0%,rgba(214,179,106,.10),transparent 30%),
    radial-gradient(circle at 90% 15%,rgba(64,120,145,.13),transparent 28%),
    var(--bg);
}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.container{width:min(1250px,94%);margin:auto}
.topbar{
  position:sticky;top:0;z-index:10;
  background:rgba(11,17,24,.91);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  min-height:76px;display:flex;align-items:center;
  justify-content:space-between;gap:15px;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-icon{
  width:45px;height:45px;border-radius:14px;
  display:grid;place-items:center;
  color:#17202a;background:linear-gradient(135deg,var(--gold2),var(--gold));
  font-size:19px;
}
.brand h1{font-size:17px;margin:0;font-weight:900}
.brand p{font-size:11px;color:var(--muted);margin:1px 0 0}
.top-actions{display:flex;align-items:center;gap:9px}
.user-label{font-size:12px;color:var(--muted)}
.btn{
  border:1px solid var(--line);border-radius:11px;
  padding:9px 14px;color:var(--text);
  background:var(--panel2);font-weight:700;
  transition:.2s;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.15)}
.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#17202a;border:0}
.btn-danger{color:#ff9ca1;border-color:rgba(240,107,114,.3);background:rgba(240,107,114,.09)}
main{padding:28px 0 55px}
.page-heading{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:22px}
.page-heading h2{margin:0;font-size:25px}
.page-heading p{margin:5px 0 0;color:var(--muted);font-size:13px}
.status-line{font-size:12px;color:var(--muted)}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-left:6px}
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:13px;margin-bottom:22px;
}
.stat{
  background:linear-gradient(145deg,rgba(24,38,49,.95),rgba(16,27,37,.95));
  border:1px solid var(--line);border-radius:17px;padding:18px;
  position:relative;overflow:hidden;
}
.stat:after{
  content:"";position:absolute;width:75px;height:75px;
  border-radius:50%;background:rgba(214,179,106,.06);
  left:-20px;top:-20px;
}
.stat-top{display:flex;justify-content:space-between;align-items:center}
.stat-icon{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;background:rgba(214,179,106,.12);
  color:var(--gold2);
}
.stat-label{font-size:12px;color:var(--muted)}
.stat-number{font-size:28px;font-weight:900;margin-top:8px}
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:15px;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;margin-bottom:17px;
}
.search-box{position:relative;flex:1;min-width:210px}
.search-box i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-box input{
  width:100%;padding:11px 40px 11px 12px;
  border-radius:10px;border:1px solid var(--line);
  background:#0c151e;color:var(--text);outline:none;
}
.toolbar select{
  min-width:160px;padding:11px;border-radius:10px;
  border:1px solid var(--line);background:#0c151e;color:var(--text);
  outline:none;
}
.toolbar select option{background:#101820}
.results-label{font-size:12px;color:var(--muted);margin-right:auto}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.consult-card{
  border:1px solid var(--line);border-radius:17px;
  background:linear-gradient(145deg,#15232e,#101a23);
  padding:18px;min-width:0;
}
.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.client-name{font-size:17px;font-weight:900;overflow-wrap:anywhere}
.date{font-size:11px;color:var(--muted);margin-top:3px}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  border-radius:30px;padding:5px 10px;font-size:11px;font-weight:800;
  white-space:nowrap;
}
.pill-new{color:#8fc1ff;background:rgba(112,173,245,.12)}
.pill-reviewing{color:#f0c47b;background:rgba(233,174,88,.12)}
.pill-contacted{color:#6ce2ae;background:rgba(50,201,135,.12)}
.pill-closed{color:#b4bec6;background:rgba(180,190,198,.12)}
.card-divider{height:1px;background:var(--line);margin:14px 0}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.meta-item small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}
.meta-item strong{font-size:13px;overflow-wrap:anywhere}
.details{
  background:rgba(0,0,0,.15);border:1px solid var(--line);
  border-radius:11px;padding:12px;margin-top:13px;
}
.details small{color:var(--muted);font-size:11px}
.details p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.9;margin:5px 0 0}
.contact-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.contact-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 13px;border-radius:10px;text-decoration:none;
  font-size:12px;font-weight:800;transition:.2s;flex:1;
}
.contact-btn:hover{transform:translateY(-2px);filter:brightness(1.15)}
.call-btn{color:#a8ceff;background:rgba(112,173,245,.10);border:1px solid rgba(112,173,245,.25)}
.whatsapp-btn{color:#65e6a9;background:rgba(37,211,102,.10);border:1px solid rgba(37,211,102,.28)}
.card-footer{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;flex-wrap:wrap;margin-top:14px;
}
.status-select{
  flex:1;min-width:150px;padding:9px 10px;
  border-radius:10px;border:1px solid var(--line);
  background:#0b151e;color:var(--text);font-size:12px;
}
.delete-btn{
  border:1px solid rgba(240,107,114,.3);
  background:rgba(240,107,114,.09);color:#ff969c;
  padding:9px 12px;border-radius:10px;font-size:12px;font-weight:800;
}
.delete-btn:hover{background:rgba(240,107,114,.18)}
.empty{
  grid-column:1/-1;text-align:center;padding:55px 15px;
  border:1px dashed var(--line);border-radius:16px;color:var(--muted);
}
.empty i{font-size:30px;color:var(--gold);margin-bottom:12px}
.login-wrap{
  min-height:100vh;display:grid;place-items:center;padding:20px;
}
.login-card{
  width:min(430px,100%);padding:30px;
  background:linear-gradient(145deg,#172630,#101a23);
  border:1px solid rgba(214,179,106,.2);border-radius:22px;
  box-shadow:0 25px 80px rgba(0,0,0,.35);
}
.login-logo{
  width:60px;height:60px;border-radius:18px;
  display:grid;place-items:center;margin:0 auto 15px;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  color:#17202a;font-size:24px;
}
.login-card h2{text-align:center;margin:0;font-size:23px}
.login-card>p{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:#c3cdd3;margin-bottom:7px}
.field input{
  width:100%;padding:12px;border-radius:11px;
  border:1px solid var(--line);background:#0b151e;color:var(--text);
  outline:none;
}
.field input:focus,.search-box input:focus{border-color:var(--gold)}
.login-submit{width:100%;padding:12px;margin-top:5px}
.error-msg{
  color:#ff969c;background:rgba(240,107,114,.09);
  border:1px solid rgba(240,107,114,.2);padding:10px;
  border-radius:10px;font-size:12px;margin-bottom:13px;
}
.toast{
  position:fixed;bottom:20px;left:20px;z-index:30;
  background:#1b2b36;border:1px solid var(--line);
  border-radius:12px;padding:12px 17px;
  box-shadow:0 12px 40px rgba(0,0,0,.3);
  font-size:13px;max-width:min(90vw,400px);
}
.toast.error{border-color:rgba(240,107,114,.4);color:#ffadb1}
.loading{text-align:center;padding:35px;color:var(--muted)}
.loading i{color:var(--gold);margin-left:8px}
footer{text-align:center;color:#71818b;font-size:11px;padding:20px}
@media(max-width:850px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .cards{grid-template-columns:1fr}
}
@media(max-width:560px){
  .topbar-inner{min-height:68px}
  .brand h1{font-size:14px}
  .brand p{font-size:10px}
  .user-label{display:none}
  main{padding-top:20px}
  .page-heading h2{font-size:21px}
  .stats{gap:9px}
  .stat{padding:13px}
  .stat-number{font-size:23px}
  .stat-label{font-size:11px}
  .toolbar select{flex:1;min-width:120px}
  .meta-grid{grid-template-columns:1fr 1fr}
  .consult-card{padding:14px}
}
</style>
</head>

<body>

<!-- تسجيل الدخول -->
<section id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="login-logo"><i class="fa-solid fa-scale-balanced"></i></div>
    <h2>MOZA LEGAL</h2>
    <p>لوحة إدارة الاستشارات القانونية</p>

    <div id="loginError" class="error-msg hidden"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" autocomplete="username" required placeholder="name@example.com">
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button class="btn btn-gold login-submit" id="loginBtn" type="submit">
        <i class="fa-solid fa-right-to-bracket"></i>
        تسجيل الدخول
      </button>
    </form>
  </div>
</section>

<!-- لوحة الإدارة -->
<div id="adminScreen" class="hidden">
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-scale-balanced"></i></div>
        <div>
          <h1>MOZA LEGAL</h1>
          <p>نظام إدارة الاستشارات</p>
        </div>
      </div>
      <div class="top-actions">
        <span class="user-label" id="adminEmail"></span>
        <button class="btn" id="refreshBtn" type="button" title="تحديث الطلبات">
          <i class="fa-solid fa-rotate"></i>
        </button>
        <button class="btn btn-danger" id="logoutBtn" type="button">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          خروج
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-heading">
      <div>
        <h2>لوحة التحكم</h2>
        <p>متابعة وإدارة طلبات الاستشارات القانونية</p>
      </div>
      <div class="status-line"><span class="status-dot"></span>النظام متصل</div>
    </div>

    <section class="stats">
      <div class="stat">
        <div class="stat-top">
          <span class="stat-label">إجمالي الطلبات</span>
          <span class="stat-icon"><i class="fa-solid fa-folder-open"></i></span>
        </div>
        <div class="stat-number" id="totalCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-top">
          <span class="stat-label">طلبات جديدة</span>
          <span class="stat-icon"><i class="fa-solid fa-bell"></i></span>
        </div>
        <div class="stat-number" id="newCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-top">
          <span class="stat-label">قيد المراجعة</span>
          <span class="stat-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
        </div>
        <div class="stat-number" id="reviewCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-top">
          <span class="stat-label">تم التواصل</span>
          <span class="stat-icon"><i class="fa-solid fa-phone"></i></span>
        </div>
        <div class="stat-number" id="contactedCount">0</div>
      </div>
    </section>

    <section class="toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="searchInput" type="search" placeholder="ابحث بالاسم أو رقم الهاتف أو التفاصيل...">
      </div>
      <select id="statusFilter">
        <option value="all">كل الحالات</option>
        <option value="new">جديد</option>
        <option value="reviewing">قيد المراجعة</option>
        <option value="contacted">تم التواصل</option>
        <option value="closed">مغلق</option>
      </select>
      <span class="results-label" id="resultsCount">0 طلب</span>
    </section>

    <section id="consultationsList" class="cards">
      <div class="empty"><i class="fa-solid fa-inbox"></i><div>جاري تحميل الطلبات...</div></div>
    </section>
  </main>

  <footer>MOZA LEGAL — لوحة الإدارة</footer>
</div>

<div id="toast" class="toast hidden" role="status"></div>

<script>
/* إعدادات Supabase */
const SUPABASE_URL = 'https://rigaeuibiwcnfhccsscj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_UTUW4uEEdnYb-nghVx-FLw_nu9pBg6E';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);

let currentUser = null;
let consultations = [];
let toastTimer = null;

const statusNames = {
  new: 'جديد',
  reviewing: 'قيد المراجعة',
  contacted: 'تم التواصل',
  closed: 'مغلق'
};

function showToast(message, isError = false) {
  const el = $('toast');
  el.textContent = message;
  el.classList.remove('hidden', 'error');
  if (isError) el.classList.add('error');

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 3500);
}

function showLoginError(message) {
  $('loginError').textContent = message;
  $('loginError').classList.remove('hidden');
}

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[char]);
}

function formatDate(value) {
  if (!value) return 'غير محدد';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return 'غير محدد';

  return new Intl.DateTimeFormat('ar-EG', {
    year:'numeric',
    month:'long',
    day:'numeric',
    hour:'2-digit',
    minute:'2-digit'
  }).format(date);
}

/* تجهيز رقم الهاتف لرابط واتساب */
function normalizePhone(phone) {
  let digits = String(phone || '').replace(/\D/g, '');

  if (!digits) return '';

  // تحويل الرقم المصري المحلي 01xxxxxxxxx أو 0xxxxxxxxxx إلى 20
  if (digits.startsWith('0')) {
    digits = '20' + digits.slice(1);
  }

  // إزالة صفر دولي زائد إذا كان الرقم مكتوبًا 0020...
  if (digits.startsWith('00')) {
    digits = digits.slice(2);
  }

  return digits;
}

function getStatusClass(status) {
  return ({
    new:'pill-new',
    reviewing:'pill-reviewing',
    contacted:'pill-contacted',
    closed:'pill-closed'
  })[status] || 'pill-new';
}

/* التأكد من أن المستخدم مدير مسجل */
async function verifyAdmin(user) {
  const { data, error } = await sb
    .from('legal_admins')
    .select('user_id')
    .eq('user_id', user.id)
    .maybeSingle();

  if (error) {
    console.error('Admin verification error:', error);
    throw new Error('تعذر التحقق من صلاحيات الحساب. راجع صلاحيات جدول legal_admins.');
  }

  if (!data) {
    throw new Error('هذا الحساب غير مسموح له بدخول لوحة الإدارة.');
  }

  return true;
}

function showAdmin(user) {
  currentUser = user;
  $('loginScreen').classList.add('hidden');
  $('adminScreen').classList.remove('hidden');
  $('adminEmail').textContent = user.email || 'مدير النظام';
}

function showLogin() {
  currentUser = null;
  consultations = [];
  $('adminScreen').classList.add('hidden');
  $('loginScreen').classList.remove('hidden');
}

/* تسجيل الدخول */
$('loginForm').addEventListener('submit', async (event) => {
  event.preventDefault();

  const email = $('email').value.trim();
  const password = $('password').value;
  const btn = $('loginBtn');

  btn.disabled = true;
  btn.textContent = 'جارٍ التحقق...';
  $('loginError').classList.add('hidden');

  try {
    const { data, error } = await sb.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;
    if (!data.user) throw new Error('تعذر تسجيل الدخول.');

    await verifyAdmin(data.user);
    showAdmin(data.user);
    await loadConsultations();
    showToast('تم تسجيل الدخول بنجاح');
  } catch (error) {
    console.error(error);
    showLoginError(error.message || 'تعذر تسجيل الدخول، راجع البيانات.');
    await sb.auth.signOut();
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول';
  }
});

/* تحميل الاستشارات */
async function loadConsultations() {
  if (!currentUser) return;

  $('consultationsList').innerHTML =
    '<div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل الطلبات...</div>';

  try {
    await verifyAdmin(currentUser);

    const { data, error } = await sb
      .from('legal_consultations')
      .select('id,full_name,phone,topic,details,status,created_at')
      .order('created_at', { ascending: false });

    if (error) throw error;

    consultations = data || [];
    updateStats();
    renderRows();
  } catch (error) {
    console.error('Load consultations error:', error);
    $('consultationsList').innerHTML =
      '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><div>' +
      escapeHTML(error.message || 'حدث خطأ أثناء تحميل الطلبات') +
      '</div></div>';
    showToast(error.message || 'تعذر تحميل الطلبات', true);
  }
}

/* الإحصائيات */
function updateStats() {
  $('totalCount').textContent = consultations.length;
  $('newCount').textContent = consultations.filter(x => x.status === 'new').length;
  $('reviewCount').textContent = consultations.filter(x => x.status === 'reviewing').length;
  $('contactedCount').textContent = consultations.filter(x => x.status === 'contacted').length;
}

/* رسم البطاقات */
function renderRows() {
  const search = $('searchInput').value.trim().toLowerCase();
  const filter = $('statusFilter').value;

  const filtered = consultations.filter(item => {
    const text = [
      item.full_name,
      item.phone,
      item.topic,
      item.details
    ].join(' ').toLowerCase();

    const matchesSearch = text.includes(search);
    const matchesStatus = filter === 'all' || item.status === filter;

    return matchesSearch && matchesStatus;
  });

  $('resultsCount').textContent = filtered.length + ' طلب';

  if (!filtered.length) {
    $('consultationsList').innerHTML =
      '<div class="empty"><i class="fa-solid fa-folder-open"></i><div>لا توجد طلبات مطابقة للبحث</div></div>';
    return;
  }

  $('consultationsList').innerHTML = filtered.map(item => {
    const phoneDigits = String(item.phone || '').replace(/\D/g, '');
    const whatsappNumber = normalizePhone(item.phone);
    const phoneLink = phoneDigits ? 'tel:' + phoneDigits : '';
    const whatsappLink = whatsappNumber
      ? 'https://wa.me/' + whatsappNumber
      : '';

    const status = statusNames[item.status] ? item.status : 'new';

    return `
      <article class="consult-card" data-id="${escapeHTML(item.id)}">
        <div class="card-head">
          <div>
            <div class="client-name">${escapeHTML(item.full_name || 'بدون اسم')}</div>
            <div class="date">
              <i class="fa-regular fa-clock"></i>
              ${escapeHTML(formatDate(item.created_at))}
            </div>
          </div>
          <span class="pill ${getStatusClass(status)}">
            <i class="fa-solid fa-circle"></i>
            ${escapeHTML(statusNames[status])}
          </span>
        </div>

        <div class="card-divider"></div>

        <div class="meta-grid">
          <div class="meta-item">
            <small>رقم الهاتف</small>
            <strong>${escapeHTML(item.phone || 'غير متوفر')}</strong>
          </div>
          <div class="meta-item">
            <small>نوع الاستشارة</small>
            <strong>${escapeHTML(item.topic || 'غير محدد')}</strong>
          </div>
        </div>

        <div class="details">
          <small><i class="fa-regular fa-file-lines"></i> تفاصيل الاستشارة</small>
          <p>${escapeHTML(item.details || 'لا توجد تفاصيل مضافة')}</p>
        </div>

        <div class="contact-actions">
          ${phoneLink ? `
            <a class="contact-btn call-btn" href="${escapeHTML(phoneLink)}">
              <i class="fa-solid fa-phone"></i>
              اتصال بالعميل
            </a>` : ''}
          ${whatsappLink ? `
            <a class="contact-btn whatsapp-btn"
               href="${escapeHTML(whatsappLink)}"
               target="_blank" rel="noopener noreferrer">
              <i class="fa-brands fa-whatsapp"></i>
              مراسلة واتساب
            </a>` : ''}
          ${!phoneLink && !whatsappLink ? `
            <span class="contact-btn call-btn" style="opacity:.55;cursor:default">
              <i class="fa-solid fa-phone-slash"></i>
              لا يوجد رقم هاتف
            </span>` : ''}
        </div>

        <div class="card-footer">
          <select class="status-select" data-status-id="${escapeHTML(item.id)}" aria-label="تغيير حالة الطلب">
            <option value="new" ${status === 'new' ? 'selected' : ''}>جديد</option>
            <option value="reviewing" ${status === 'reviewing' ? 'selected' : ''}>قيد المراجعة</option>
            <option value="contacted" ${status === 'contacted' ? 'selected' : ''}>تم التواصل</option>
            <option value="closed" ${status === 'closed' ? 'selected' : ''}>مغلق</option>
          </select>
          <button class="delete-btn" type="button" data-delete-id="${escapeHTML(item.id)}">
            <i class="fa-solid fa-trash"></i>
            حذف الطلب
          </button>
        </div>
      </article>
    `;
  }).join('');
}

/* البحث والفلترة */
$('searchInput').addEventListener('input', renderRows);
$('statusFilter').addEventListener('change', renderRows);

/* تغيير حالة الطلب */
$('consultationsList').addEventListener('change', async (event) => {
  const select = event.target.closest('[data-status-id]');
  if (!select) return;

  const id = select.dataset.statusId;
  const newStatus = select.value;
  const oldItem = consultations.find(x => String(x.id) === String(id));

  if (!oldItem) return;

  const oldStatus = oldItem.status;
  select.disabled = true;

  try {
    await verifyAdmin(currentUser);

    const { error } = await sb
      .from('legal_consultations')
      .update({ status: newStatus })
      .eq('id', id);

    if (error) throw error;

    oldItem.status = newStatus;
    updateStats();
    renderRows();
    showToast('تم تحديث حالة الطلب');
  } catch (error) {
    console.error(error);
    select.value = oldStatus;
    showToast(error.message || 'تعذر تحديث الحالة', true);
  } finally {
    select.disabled = false;
  }
});

/* حذف الطلب */
$('consultationsList').addEventListener('click', async (event) => {
  const button = event.target.closest('[data-delete-id]');
  if (!button) return;

  const id = button.dataset.deleteId;
  const item = consultations.find(x => String(x.id) === String(id));

  if (!item) return;

  const confirmed = window.confirm(
    'هل أنت متأكد من حذف طلب الاستشارة الخاص بـ "' +
    (item.full_name || 'العميل') +
    '"؟\n\nلا يمكن التراجع عن الحذف.'
  );

  if (!confirmed) return;

  button.disabled = true;
  button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جارٍ الحذف';

  try {
    await verifyAdmin(currentUser);

    const { error } = await sb
      .from('legal_consultations')
      .delete()
      .eq('id', id);

    if (error) throw error;

    consultations = consultations.filter(x => String(x.id) !== String(id));
    updateStats();
    renderRows();
    showToast('تم حذف الطلب بنجاح');
  } catch (error) {
    console.error('Delete error:', error);
    showToast(error.message || 'تعذر حذف الطلب. راجع صلاحيات قاعدة البيانات.', true);
    button.disabled = false;
    button.innerHTML = '<i class="fa-solid fa-trash"></i> حذف الطلب';
  }
});

/* تحديث يدوي */
$('refreshBtn').addEventListener('click', loadConsultations);

/* تسجيل الخروج */
$('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  showLogin();
  showToast('تم تسجيل الخروج');
});

/* استعادة الجلسة عند فتح الصفحة */
(async function init() {
  try {
    const { data, error } = await sb.auth.getSession();
    if (error) throw error;

    const user = data.session?.user;
    if (!user) return;

    await verifyAdmin(user);
    showAdmin(user);
    await loadConsultations();
  } catch (error) {
    console.error('Session restore error:', error);
    await sb.auth.signOut();
    showLogin();
  }
})();
</script>
</body>
</html>
